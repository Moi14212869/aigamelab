<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DRIFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e1a;
    --bg2:#121834;
    --panel:#141b36ee;
    --line:#2a3260;
    --ship:#ffb454;
    --ship2:#ff7a3d;
    --hazard:#c86bfa;
    --hazard2:#7c3aed;
    --pickup:#3ddad7;
    --pickup2:#1798a8;
    --text:#f1f3fb;
    --muted:#8892bf;
    --danger:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',monospace;-webkit-user-select:none;user-select:none;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:20px 26px;pointer-events:none;}
  .hud-block{display:flex;flex-direction:column;gap:3px;}
  .hud-block.right{align-items:flex-end;}
  .hud-label{color:var(--muted);font-size:10px;letter-spacing:.2em;}
  .hud-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  #waveVal{color:var(--hazard);}
  #bestVal{color:var(--pickup);}

  #banner{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
    font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:.5em;
    color:var(--hazard);opacity:0;pointer-events:none;text-transform:uppercase;
    text-shadow:0 0 18px rgba(200,107,250,.8);transition:opacity .25s;}

  #meterWrap{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;}
  #meterLabel{font-size:10px;letter-spacing:.25em;color:var(--muted);}
  #meterBar{width:190px;height:7px;border:1px solid var(--line);border-radius:4px;
    overflow:hidden;background:rgba(255,255,255,.03);}
  #meterFill{height:100%;width:0%;background:linear-gradient(90deg,var(--pickup2),var(--pickup));}
  #shockBtn{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-family:'Space Grotesk',sans-serif;
    font-size:9px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;transition:all .2s;}
  #shockBtn.ready{border-color:var(--pickup);color:var(--pickup);
    box-shadow:0 0 22px rgba(61,218,215,.45);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:22px;background:rgba(9,11,22,.82);backdrop-filter:blur(8px);
    text-align:center;padding:24px;}
  .hidden{display:none !important;}

  .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(48px,12vw,92px);
    letter-spacing:.05em;margin:0;background:linear-gradient(120deg,var(--ship) 0%,var(--pickup) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .subtitle{margin:0;color:var(--muted);font-size:13px;letter-spacing:.15em;text-transform:uppercase;}

  .rules{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;
    font-size:12px;color:var(--muted);letter-spacing:.03em;}
  .rules b{color:var(--text);font-weight:700;}
  .rules span.key{display:inline-block;border:1px solid var(--line);border-radius:4px;
    padding:1px 7px;color:var(--text);margin-right:6px;font-size:10px;}

  .go-panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;
    padding:34px 46px;display:flex;flex-direction:column;gap:16px;align-items:center;min-width:260px;}
  .go-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;
    color:var(--danger);letter-spacing:.08em;margin:0;}
  .stat-row{display:flex;gap:30px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .n{font-size:24px;font-weight:700;color:var(--text);}
  .stat .l{font-size:9px;letter-spacing:.2em;color:var(--muted);}
  .newbest{font-size:11px;letter-spacing:.15em;color:var(--pickup);opacity:0;transition:opacity .3s;}
  .newbest.show{opacity:1;}

  button.primary{background:var(--ship);border:none;color:#1a1000;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:14px;letter-spacing:.12em;padding:13px 30px;border-radius:8px;
    cursor:pointer;text-transform:uppercase;transition:transform .15s, box-shadow .15s;}
  button.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,180,84,.3);}
  button.primary:active{transform:translateY(0);}

  #flash{position:fixed;inset:0;background:var(--text);opacity:0;pointer-events:none;}

  @media (max-width:520px){
    .hud-value{font-size:17px;}
    .go-panel{padding:26px 24px;min-width:0;width:88%;}
    .stat-row{gap:20px;}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="flash"></div>
<div id="banner"></div>

<div id="hud">
  <div class="hud-block">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="scoreVal">0</div>
  </div>
  <div class="hud-block right">
    <div class="hud-label">VAGUE</div>
    <div class="hud-value" id="waveVal">1</div>
  </div>
</div>
<div class="hud-block" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);align-items:center;">
  <div class="hud-label">MEILLEUR</div>
  <div class="hud-value" id="bestVal">0</div>
</div>

<div id="meterWrap">
  <div id="meterLabel">DÉCHARGE — <span id="meterPct">0%</span></div>
  <div id="meterBar"><div id="meterFill"></div></div>
  <div id="shockBtn">ESPACE</div>
</div>

<div id="startScreen" class="overlay">
  <h1 class="title">DRIFT</h1>
  <p class="subtitle">Survis au champ de débris</p>
  <ul class="rules">
    <li><span class="key">souris / doigt</span> pilote ta sonde</li>
    <li><span class="key">motes cyan</span> chargent ta décharge</li>
    <li><span class="key">espace</span> ou bouton — libère la décharge à 100%</li>
  </ul>
  <button class="primary" id="startBtn">Lancer</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <div class="go-panel">
    <h2 class="go-title">SIGNAL PERDU</h2>
    <div class="stat-row">
      <div class="stat"><div class="n" id="finalScore">0</div><div class="l">SCORE</div></div>
      <div class="stat"><div class="n" id="finalWave">1</div><div class="l">VAGUE</div></div>
    </div>
    <div class="newbest" id="newBestTag">NOUVEAU RECORD</div>
    <button class="primary" id="retryBtn">Rejouer</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = {
    score: document.getElementById('scoreVal'),
    wave: document.getElementById('waveVal'),
    best: document.getElementById('bestVal'),
    meterFill: document.getElementById('meterFill'),
    meterPct: document.getElementById('meterPct'),
    shockBtn: document.getElementById('shockBtn'),
    banner: document.getElementById('banner'),
    flash: document.getElementById('flash'),
  };
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const finalWaveEl = document.getElementById('finalWave');
  const newBestTag = document.getElementById('newBestTag');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(ship){ ship.x = Math.min(ship.x, W); ship.y = Math.min(ship.y, H); ship.tx = ship.x; ship.ty = ship.y; }
  }
  window.addEventListener('resize', resize);

  let BEST = 0;
  async function loadBest(){
    try{
      const res = await window.storage.get('drift:best-score', false);
      if(res && res.value){ BEST = parseInt(res.value,10) || 0; }
    }catch(e){ BEST = 0; }
    hud.best.textContent = BEST;
  }
  async function saveBest(v){
    try{ await window.storage.set('drift:best-score', String(v), false); }catch(e){}
  }

  let state = 'start';
  let score = 0, wave = 1, waveTimer = 0, waveDuration = 15000;
  let ship, pointer, hazards, pickups, particles, scorePops, shock, stars;
  let lastTime = 0, shakeTime = 0, shakeMag = 0, bannerTimer = 0;
  let spawnHazardT = 0, spawnPickupT = 0;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }

  function initStars(){
    stars = [];
    const n = Math.floor((W*H)/9000);
    for(let i=0;i<n;i++){
      stars.push({x:rand(0,W), y:rand(0,H), r:rand(.4,1.6), tw:rand(0,Math.PI*2), sp:rand(.15,.5)});
    }
  }

  function initGame(){
    score = 0; wave = 1; waveTimer = 0; waveDuration = 15000;
    hazards = []; pickups = []; particles = []; scorePops = [];
    spawnHazardT = 0; spawnPickupT = 900;
    shakeTime = 0; shakeMag = 0; bannerTimer = 0;
    ship = { x: W/2, y: H/2, tx: W/2, ty: H/2, vx:0, vy:0, angle:0, r: 10, trail: [] };
    pointer = { x: W/2, y: H/2 };
    shock = { charge: 0, active: false, radius: 0, maxRadius: Math.max(W,H)*0.55 };
    hud.score.textContent = '0';
    hud.wave.textContent = '1';
    updateMeterUI();
  }

  function makeRock(radius){
    const pts = [];
    const n = 7 + Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2;
      const r = radius * rand(0.7,1.15);
      pts.push({a, r});
    }
    return pts;
  }

  function spawnHazard(){
    const edge = Math.floor(rand(0,4));
    let x,y;
    if(edge===0){ x = rand(0,W); y = -40; }
    else if(edge===1){ x = W+40; y = rand(0,H); }
    else if(edge===2){ x = rand(0,W); y = H+40; }
    else { x = -40; y = rand(0,H); }
    const targetX = rand(W*0.25, W*0.75);
    const targetY = rand(H*0.25, H*0.75);
    const ang = Math.atan2(targetY-y, targetX-x) + rand(-0.35,0.35);
    const speed = (70 + wave*11) * rand(0.85,1.2);
    const radius = rand(14,27);
    hazards.push({
      x,y, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
      r: radius, rot: rand(0,Math.PI*2), rotSpeed: rand(-1.2,1.2),
      pts: makeRock(radius)
    });
  }

  function spawnPickup(){
    if(pickups.length > 5) return;
    const margin = 60;
    pickups.push({
      x: rand(margin, W-margin), y: rand(margin, H-margin),
      vx: rand(-12,12), vy: rand(-12,12), r: 8, pulse: rand(0,Math.PI*2)
    });
  }

  function spawnParticles(x,y,color,count,speedMin,speedMax,lifeMs){
    for(let i=0;i<count;i++){
      const a = rand(0,Math.PI*2);
      const sp = rand(speedMin,speedMax);
      particles.push({
        x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life: lifeMs, maxLife: lifeMs, color, size: rand(1.5,3.5)
      });
    }
  }

  function spawnScorePop(x,y,text){
    scorePops.push({ x, y, text, life: 700, maxLife: 700 });
  }

  function updateMeterUI(){
    const pct = Math.round(shock.charge);
    hud.meterFill.style.width = pct + '%';
    hud.meterPct.textContent = pct + '%';
    if(pct >= 100) hud.shockBtn.classList.add('ready');
    else hud.shockBtn.classList.remove('ready');
  }

  function showBanner(text){
    hud.banner.textContent = text;
    hud.banner.style.opacity = '1';
    bannerTimer = 1600;
  }

  function triggerShockwave(){
    if(shock.charge < 100 || shock.active) return;
    shock.active = true;
    shock.radius = 0;
    shock.charge = 0;
    updateMeterUI();
    hud.flash.style.transition = 'opacity .08s';
    hud.flash.style.opacity = '0.35';
    setTimeout(()=>{ hud.flash.style.transition = 'opacity .4s'; hud.flash.style.opacity = '0'; }, 60);
  }

  function triggerGameOver(){
    state = 'gameover';
    shakeTime = 320; shakeMag = 14;
    spawnParticles(ship.x, ship.y, getVar('--danger'), 34, 60, 260, 700);
    hud.flash.style.transition = 'opacity .05s';
    hud.flash.style.opacity = '0.5';
    setTimeout(()=>{ hud.flash.style.transition = 'opacity .5s'; hud.flash.style.opacity = '0'; }, 60);

    setTimeout(async ()=>{
      finalScoreEl.textContent = Math.floor(score);
      finalWaveEl.textContent = wave;
      if(Math.floor(score) > BEST){
        BEST = Math.floor(score);
        hud.best.textContent = BEST;
        await saveBest(BEST);
        newBestTag.classList.add('show');
      } else {
        newBestTag.classList.remove('show');
      }
      gameOverScreen.classList.remove('hidden');
    }, 380);
  }

  let cssVarCache = {};
  function getVar(name){
    if(cssVarCache[name]) return cssVarCache[name];
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    cssVarCache[name] = v;
    return v;
  }

  function update(dt){
    if(state !== 'playing') return;

    const dtS = dt/1000;
    score += dtS * (8 + wave*1.4);
    hud.score.textContent = Math.floor(score);

    waveTimer += dt;
    if(waveTimer >= waveDuration){
      waveTimer = 0;
      wave++;
      waveDuration = Math.max(8000, waveDuration - 500);
      hud.wave.textContent = wave;
      showBanner('VAGUE ' + wave);
    }

    ship.tx = pointer.x; ship.ty = pointer.y;
    const followK = 1 - Math.pow(0.001, dtS);
    const px = ship.x, py = ship.y;
    ship.x += (ship.tx - ship.x) * followK;
    ship.y += (ship.ty - ship.y) * followK;
    ship.x = Math.max(ship.r, Math.min(W-ship.r, ship.x));
    ship.y = Math.max(ship.r, Math.min(H-ship.r, ship.y));
    ship.vx = (ship.x - px)/dtS; ship.vy = (ship.y - py)/dtS;
    if(Math.hypot(ship.vx,ship.vy) > 8){
      ship.angle = Math.atan2(ship.vy, ship.vx);
    }
    ship.trail.push({x:ship.x, y:ship.y});
    if(ship.trail.length > 16) ship.trail.shift();
    if(Math.random() < 0.5){
      spawnParticles(ship.x, ship.y, getVar('--ship'), 1, 5, 20, 400);
    }

    spawnHazardT -= dt;
    const hazardInterval = Math.max(230, 950 - wave*55);
    if(spawnHazardT <= 0){ spawnHazard(); spawnHazardT = hazardInterval * rand(0.7,1.3); }

    spawnPickupT -= dt;
    const pickupInterval = Math.max(750, 1700 - wave*35);
    if(spawnPickupT <= 0){ spawnPickup(); spawnPickupT = pickupInterval * rand(0.8,1.3); }

    for(let i=hazards.length-1;i>=0;i--){
      const hz = hazards[i];
      hz.x += hz.vx*dtS; hz.y += hz.vy*dtS; hz.rot += hz.rotSpeed*dtS;
      if(hz.x < -120 || hz.x > W+120 || hz.y < -120 || hz.y > H+120){ hazards.splice(i,1); continue; }
      if(shock.active){
        const d = dist(hz.x,hz.y, ship.x, ship.y);
        if(d < shock.radius + hz.r*0.5){
          score += 40;
          hud.score.textContent = Math.floor(score);
          spawnParticles(hz.x, hz.y, getVar('--hazard'), 10, 40, 140, 500);
          spawnScorePop(hz.x, hz.y, '+40');
          hazards.splice(i,1); continue;
        }
      }
      const d2 = dist(hz.x, hz.y, ship.x, ship.y);
      if(d2 < hz.r*0.72 + ship.r*0.85){
        triggerGameOver();
        return;
      }
    }

    for(let i=pickups.length-1;i>=0;i--){
      const pk = pickups[i];
      pk.x += pk.vx*dtS; pk.y += pk.vy*dtS; pk.pulse += dtS*4;
      if(pk.x < pk.r || pk.x > W-pk.r) pk.vx *= -1;
      if(pk.y < pk.r || pk.y > H-pk.r) pk.vy *= -1;
      const d = dist(pk.x,pk.y, ship.x, ship.y);
      if(d < pk.r + ship.r){
        score += 25;
        shock.charge = Math.min(100, shock.charge + 11);
        updateMeterUI();
        spawnParticles(pk.x, pk.y, getVar('--pickup'), 12, 40, 150, 450);
        pickups.splice(i,1);
      }
    }

    if(shock.active){
      shock.radius += (shock.maxRadius) * dtS * 2.2;
      if(shock.radius >= shock.maxRadius){ shock.active = false; }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      p.x += p.vx*dtS; p.y += p.vy*dtS;
      p.vx *= 0.94; p.vy *= 0.94;
    }

    for(let i=scorePops.length-1;i>=0;i--){
      const sp = scorePops[i];
      sp.life -= dt;
      sp.y -= dt*0.04;
      if(sp.life <= 0) scorePops.splice(i,1);
    }

    if(bannerTimer > 0){
      bannerTimer -= dt;
      if(bannerTimer <= 0) hud.banner.style.opacity = '0';
    }
    if(shakeTime > 0) shakeTime -= dt;
  }

  function drawShip(){
    ctx.save();
    ctx.translate(ship.x, ship.y);
    if(ship.trail.length > 1){
      ctx.save();
      for(let i=1;i<ship.trail.length;i++){
        const a = ship.trail[i-1], b = ship.trail[i];
        const t = i/ship.trail.length;
        ctx.strokeStyle = getVar('--ship');
        ctx.globalAlpha = t*0.35;
        ctx.lineWidth = t*5;
        ctx.beginPath();
        ctx.moveTo(a.x-ship.x, a.y-ship.y);
        ctx.lineTo(b.x-ship.x, b.y-ship.y);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.rotate(ship.angle);
    ctx.shadowColor = getVar('--ship');
    ctx.shadowBlur = 18;
    ctx.fillStyle = getVar('--ship');
    ctx.beginPath();
    ctx.moveTo(14,0);
    ctx.lineTo(-9,-8);
    ctx.lineTo(-4,0);
    ctx.lineTo(-9,8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shakeTime > 0){
      const m = shakeMag * (shakeTime/320);
      ctx.translate(rand(-m,m), rand(-m,m));
    }

    ctx.fillStyle = getVar('--bg');
    ctx.fillRect(-30,-30,W+60,H+60);

    for(const s of stars){
      const tw = 0.5 + Math.sin(s.tw + performance.now()*0.001*s.sp)*0.5;
      ctx.globalAlpha = 0.3 + tw*0.5;
      ctx.fillStyle = '#cdd4ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for(const pk of pickups){
      const pulse = 1 + Math.sin(pk.pulse)*0.18;
      ctx.save();
      ctx.shadowColor = getVar('--pickup');
      ctx.shadowBlur = 14;
      ctx.fillStyle = getVar('--pickup');
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, pk.r*pulse, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    for(const hz of hazards){
      ctx.save();
      ctx.translate(hz.x, hz.y);
      ctx.rotate(hz.rot);
      ctx.shadowColor = getVar('--hazard2');
      ctx.shadowBlur = 10;
      const grad = ctx.createLinearGradient(-hz.r,-hz.r,hz.r,hz.r);
      grad.addColorStop(0, getVar('--hazard'));
      grad.addColorStop(1, getVar('--hazard2'));
      ctx.fillStyle = grad;
      ctx.beginPath();
      hz.pts.forEach((p,i)=>{
        const x = Math.cos(p.a)*p.r, y = Math.sin(p.a)*p.r;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    for(const p of particles){
      const t = p.life/p.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*t, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.font = "700 15px 'Space Grotesk', sans-serif";
    ctx.textAlign = 'center';
    for(const sp of scorePops){
      const t = sp.life/sp.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = getVar('--hazard');
      ctx.shadowColor = getVar('--hazard');
      ctx.shadowBlur = 10;
      ctx.fillText(sp.text, sp.x, sp.y);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    if(state==='playing') drawShip();

    if(shock.active){
      ctx.save();
      ctx.strokeStyle = getVar('--pickup');
      ctx.lineWidth = 3;
      ctx.globalAlpha = 1 - (shock.radius/shock.maxRadius);
      ctx.shadowColor = getVar('--pickup');
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(ship.x, ship.y, shock.radius, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(ts){
    if(!lastTime) lastTime = ts;
    let dt = ts - lastTime;
    lastTime = ts;
    if(dt > 50) dt = 50;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function setPointerFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if(e.touches && e.touches.length){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    pointer.x = cx - rect.left;
    pointer.y = cy - rect.top;
  }
  window.addEventListener('pointermove', (e)=>{ if(state==='playing') setPointerFromEvent(e); });
  window.addEventListener('touchmove', (e)=>{ if(state==='playing'){ setPointerFromEvent(e); e.preventDefault(); } }, {passive:false});

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){ e.preventDefault(); if(state==='playing') triggerShockwave(); }
  });
  hud.shockBtn.addEventListener('click', ()=>{ if(state==='playing') triggerShockwave(); });

  function startGame(){
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    newBestTag.classList.remove('show');
    initGame();
    state = 'playing';
  }
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resize();
  initStars();
  loadBest();
  ship = { x: W/2, y: H/2, tx: W/2, ty: H/2, vx:0, vy:0, angle:0, r:10, trail: [] };
  pointer = { x: W/2, y: H/2 };
  hazards = []; pickups = []; particles = []; scorePops = [];
  shock = { charge:0, active:false, radius:0, maxRadius: Math.max(W,H)*0.55 };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
