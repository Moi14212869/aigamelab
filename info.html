<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIGameLab — Détails du jeu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #0b0a14;
  --bg-alt: #14121f;
  --panel: #1c1930;
  --panel-border: #322c4d;
  --magenta: #ff2e7e;
  --cyan: #38e8e1;
  --amber: #ffc145;
  --text: #f1eefb;
  --text-dim: #8b87a6;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100%;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.015) 0px,
    rgba(255, 255, 255, 0.015) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 999;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.page {
  max-width: 780px;
  margin: 0 auto;
  padding: 48px 32px 80px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  margin-bottom: 36px;
  transition: color 0.15s ease;
}

.back-link:hover {
  color: var(--cyan);
}

.info-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

.info-card::before {
  content: "";
  position: absolute;
  top: -1px; left: -1px; right: -1px;
  height: 3px;
  background: linear-gradient(90deg, var(--magenta), var(--amber), var(--cyan));
}

.info-media {
  aspect-ratio: 16 / 8;
  background: var(--bg-alt);
  overflow: hidden;
}

.info-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.info-body {
  padding: 32px;
}

.info-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 12px;
}

.info-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 5vw, 40px);
  margin: 0 0 20px;
  letter-spacing: 0.01em;
}

.info-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  padding: 8px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  margin-bottom: 28px;
}

.info-meta strong {
  color: var(--amber);
  font-weight: 500;
}

.info-description {
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  margin: 0 0 32px;
}

.info-actions a {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 6px;
  background: var(--magenta);
  color: var(--bg);
  border: 1px solid var(--magenta);
  transition: background 0.15s ease, border-color 0.15s ease;
}

.info-actions a:hover {
  background: var(--amber);
  border-color: var(--amber);
}

.error-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}
</style>
</head>
<body>
  <div class="page">
    <a class="back-link" href="aigamelab.html">&larr; Retour à l'accueil</a>
    <div id="content">
      <div class="error-state">Chargement…</div>
    </div>
  </div>

<script>
const content = document.getElementById('content');

function getGameNameFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('jeu');
}

function renderGame(game) {
  content.innerHTML = `
    <div class="info-card">
      <div class="info-media">
        <img src="${game.image}" alt="${game.nom}" />
      </div>
      <div class="info-body">
        <div class="info-tag">// fiche du jeu</div>
        <h1 class="info-title">${game.nom}</h1>
        <div class="info-meta">codé à 100&nbsp;% par <strong>${game.ia || 'une IA'}</strong></div>
        <p class="info-description">${game.description || "Pas de description disponible pour ce jeu."}</p>
        <div class="info-actions">
          <a href="${game.lien || '#'}" target="_blank" rel="noopener noreferrer">Jouer maintenant &rarr;</a>
        </div>
      </div>
    </div>
  `;
}

function renderError(message) {
  content.innerHTML = `<div class="error-state">${message}</div>`;
}

async function loadGame() {
  const nom = getGameNameFromUrl();

  if (!nom) {
    renderError("Aucun jeu spécifié. Retournez à l'accueil et choisissez un jeu.");
    return;
  }

  try {
    const response = await fetch('game.json');
    if (!response.ok) throw new Error('Réponse réseau non valide');
    const games = await response.json();
    const game = games.find((g) => g.nom === nom);

    if (!game) {
      renderError(`Jeu introuvable : "${nom}".`);
      return;
    }

    renderGame(game);
  } catch (err) {
    console.error('Impossible de charger game.json :', err);
    renderError(`
      Impossible de charger game.json.<br />
      Ouvrez ce site via un serveur local (ex : python3 -m http.server)
      plutôt qu'en double-cliquant directement sur le fichier.
    `);
  }
}

loadGame();
</script>
</body>
</html>
